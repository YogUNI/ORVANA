services:
  db:
    image: postgres:16-alpine
    container_name: orvana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orvana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orvana_pass}
      POSTGRES_DB: ${POSTGRES_DB:-orvana_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orvana_user} -d ${POSTGRES_DB:-orvana_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
