services:
  db:
    image: postgres:16-alpine
    container_name: orvana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orvana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orvana_pass}
      POSTGRES_DB: ${POSTGRES_DB:-orvana_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orvana_user} -d ${POSTGRES_DB:-orvana_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orvana-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orvana_user}:${POSTGRES_PASSWORD:-orvana_pass}@db:5432/${POSTGRES_DB:-orvana_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-orvana_super_secret_access_jwt_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-orvana_super_secret_refresh_jwt_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      UPLOAD_DIR: ./uploads
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orvana-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
